<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte interactive des entreprises</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
* {
    box-sizing: border-box;
}

html, body, #map {
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
}

#map {
    z-index: 1;
}

/* PANNEAU PRINCIPAL */
.panel {
    position: absolute;
    z-index: 1000;
    top: 15px;
    left: 15px;
    width: 370px;
    max-height: calc(100vh - 30px);
    background: white;
    border-radius: 12px;
    box-shadow: 0 3px 18px rgba(0,0,0,.28);
    overflow: hidden;
}

.header {
    padding: 16px 18px;
    background: #f8f9fa;
    border-bottom: 1px solid #e5e5e5;
}

.header h1 {
    margin: 0 0 5px;
    font-size: 19px;
}

.header p {
    margin: 0;
    font-size: 12px;
    color: #666;
}

.body {
    padding: 14px;
}

label {
    display: block;
    margin: 10px 0 5px;
    font-size: 12px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 14px;
    background: white;
}

.stats {
    margin: 12px 0;
    padding: 11px;
    border-radius: 8px;
    background: #f1f3f5;
    font-size: 14px;
}

.actions {
    display: flex;
    gap: 7px;
    margin-bottom: 10px;
}

button {
    border: none;
    border-radius: 7px;
    padding: 9px 12px;
    cursor: pointer;
    background: #e9ecef;
}

button:hover {
    filter: brightness(.95);
}

#reset {
    background: #222;
    color: white;
}

#clear {
    background: #e9ecef;
}

#results {
    overflow-y: auto;
    max-height: 40vh;
    border-top: 1px solid #eee;
}

.result {
    padding: 10px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
}

.result:hover {
    background: #f5f5f5;
}

.result strong {
    display: block;
    margin-bottom: 3px;
}

.result small {
    color: #666;
}

/* POPUP */
.popup-title {
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 8px;
}

.popup-table {
    border-collapse: collapse;
    font-size: 12px;
}

.popup-table td {
    padding: 4px 8px 4px 0;
    vertical-align: top;
}

.popup-table td:first-child {
    font-weight: bold;
}

/* BOUTON MOBILE */
#toggle {
    display: none;
    position: absolute;
    z-index: 1001;
    top: 15px;
    left: 15px;
    background: white;
    box-shadow: 0 2px 10px rgba(0,0,0,.3);
}

/* MOBILE */
@media (max-width: 700px) {

    .panel {
        display: none;
        top: 60px;
        left: 10px;
        width: calc(100% - 20px);
        max-height: 65vh;
    }

    .panel.open {
        display: block;
    }

    #toggle {
        display: block;
    }

    #results {
        max-height: 28vh;
    }
}
</style>

</head>
<body>
<div id="map"></div>
<div class="panel">
<h2>Entreprises recensées</h2>
<div class="search-row">
<input id="search" type="text" placeholder="Rechercher...">
<button id="clear">✕</button>
</div>
<div id="result-count"></div>
<div id="results"></div>
</div>
<button id="panel-toggle">☰</button>

const map=L.map('map').setView([16,-15],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]) )}
const props=DATA.features;
function popup(p){
 let rows='';
 Object.entries(p).forEach(([k,v])=>{if(v!==null&&v!==''&&v!==undefined)rows+=`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`});
 return `<table class="popup-table">${rows}</table>`;
}
const layer=L.geoJSON(DATA,{
 pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:7,weight:1,fillOpacity:.8}),
 onEachFeature:(f,l)=>l.bindPopup(popup(f.properties))
}).addTo(map);
if(layer.getBounds().isValid())map.fitBounds(layer.getBounds().pad(.05));
function results(list){
 document.getElementById('result-count').textContent=`${list.length} entreprise(s)`;
 const box=document.getElementById('results');box.innerHTML='';
 list.slice(0,100).forEach(f=>{
  const d=document.createElement('div');d.className='result';
  const vals=Object.values(f.properties).filter(v=>v!==null&&v!=='');
  d.innerHTML=`<strong>${esc(vals[0]??'Entreprise')}</strong>${esc(vals.slice(1,3).join(' — '))}`;
  d.onclick=()=>{const [lng,lat]=f.geometry.coordinates;map.setView([lat,lng],15);const l=layer.getLayers().find(x=>x.feature===f);if(l)l.openPopup()};
  box.appendChild(d);
 });
}
results(props);
document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();results(props.filter(f=>Object.values(f.properties).some(v=>String(v??'').toLowerCase().includes(q))))};
document.getElementById('clear').onclick=()=>{document.getElementById('search').value='';results(props)};
document.getElementById('panel-toggle').onclick=()=>document.querySelector('.panel').classList.toggle('open');
</script>
