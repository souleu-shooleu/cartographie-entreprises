<style>
*{box-sizing:border-box}
html,body,#map{height:100%;margin:0;font-family:Arial,sans-serif}
#map{z-index:1}
.panel{position:absolute;z-index:1000;top:15px;left:15px;width:390px;max-height:calc(100vh - 30px);background:#fff;border-radius:12px;box-shadow:0 3px 18px rgba(0,0,0,.28);overflow:hidden}
.header{padding:16px 18px;background:#f8f9fa;border-bottom:1px solid #e5e5e5}
.header h1{margin:0 0 5px;font-size:19px}.header p{margin:0;font-size:12px;color:#666}
.body{padding:14px}label{display:block;margin:10px 0 5px;font-size:12px;font-weight:bold}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:7px;font-size:14px;background:#fff}
.stats{margin:12px 0;padding:11px;border-radius:8px;background:#f1f3f5;font-size:14px}
.actions{display:flex;gap:7px;margin-bottom:10px}button{border:0;border-radius:7px;padding:9px 12px;cursor:pointer;background:#e9ecef}
#reset{background:#222;color:#fff}
#results{overflow-y:auto;max-height:38vh;border-top:1px solid #eee}
.result{padding:10px;border-bottom:1px solid #eee;cursor:pointer}.result:hover{background:#f5f5f5}
.result strong{display:block;margin-bottom:3px}.result small{color:#666}
.popup-title{font-weight:bold;font-size:16px;margin-bottom:8px}.popup-table{border-collapse:collapse;font-size:12px}
.popup-table td{padding:4px 8px 4px 0;vertical-align:top}.popup-table td:first-child{font-weight:bold}
#toggle{display:none;position:absolute;z-index:1001;top:15px;left:15px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3)}
@media(max-width:700px){.panel{display:none;top:60px;left:10px;width:calc(100% - 20px);max-height:68vh}.panel.open{display:block}#toggle{display:block}#results{max-height:24vh}}
</style>
</head>

const map=L.map('map');
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'});
L.control.layers({'OpenStreetMap':osm,'Satellite':satellite},null,{collapsed:false}).addTo(map);

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
const features=DATA.features;
const communeSelect=document.getElementById('commune');
const arrondissementSelect=document.getElementById('arrondissement');

const communes=[...new Set(features.map(f=>f.properties.Commune).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));
communes.forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;communeSelect.appendChild(o)});

function fillArrondissements(){
 const commune=communeSelect.value;
 const vals=[...new Set(features.filter(f=>!commune||f.properties.Commune===commune).map(f=>f.properties.Arrondisse).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));
 const current=arrondissementSelect.value;
 arrondissementSelect.innerHTML='<option value="">Tous les arrondissements</option>';
 vals.forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;arrondissementSelect.appendChild(o)});
 if(vals.includes(current)) arrondissementSelect.value=current;
}

function popupContent(p){
 let rows='';
 const fields=[['Nom de l’entreprise',p.Nom_de_l_e],['Arrondissement',p.Arrondisse],['Commune',p.Commune],['Latitude',p.Latitude],['Longitude',p.Longitude]];
 fields.forEach(([k,v])=>{if(v!==null&&v!==undefined&&v!=='')rows+=`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`});
 return `<div class="popup-title">${esc(p.Nom_de_l_e||'Entreprise')}</div><table class="popup-table">${rows}</table>`;
}

let enterpriseLayer=L.geoJSON(DATA,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:7,weight:1,fillOpacity:.82}),onEachFeature:(f,l)=>l.bindPopup(popupContent(f.properties))}).addTo(map);

function resetView(){const b=enterpriseLayer.getBounds();if(b.isValid())map.fitBounds(b.pad(.05))}

function filteredFeatures(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 const c=communeSelect.value, a=arrondissementSelect.value;
 return features.filter(f=>{
  const p=f.properties;
  const text=Object.values(p).some(v=>String(v??'').toLowerCase().includes(q));
  return text&&(!c||p.Commune===c)&&(!a||p.Arrondisse===a);
 });
}

function refreshMap(){
 const filtered=filteredFeatures();
 enterpriseLayer.clearLayers();
 const newLayer=L.geoJSON({type:'FeatureCollection',features:filtered},{
  pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:7,weight:1,fillOpacity:.82}),
  onEachFeature:(f,l)=>l.bindPopup(popupContent(f.properties))
 });
 newLayer.eachLayer(l=>enterpriseLayer.addLayer(l));
 document.getElementById('count').textContent=filtered.length;
 const results=document.getElementById('results');results.innerHTML='';
 filtered.slice(0,200).forEach(f=>{
  const p=f.properties,item=document.createElement('div');item.className='result';
  item.innerHTML=`<strong>${esc(p.Nom_de_l_e||'Entreprise sans nom')}</strong><small>${esc(p.Commune||'Commune non renseignée')}${p.Arrondisse?' — '+esc(p.Arrondisse):''}</small>`;
  item.onclick=()=>{const [lng,lat]=f.geometry.coordinates;map.setView([lat,lng],15);const point=enterpriseLayer.getLayers().find(x=>x.feature===f);if(point)point.openPopup()};
  results.appendChild(item);
 });
}

document.getElementById('search').addEventListener('input',refreshMap);
communeSelect.addEventListener('change',()=>{fillArrondissements();refreshMap()});
arrondissementSelect.addEventListener('change',refreshMap);
document.getElementById('clear').addEventListener('click',()=>{document.getElementById('search').value='';communeSelect.value='';fillArrondissements();arrondissementSelect.value='';refreshMap();resetView()});
document.getElementById('reset').addEventListener('click',resetView);
document.getElementById('toggle').addEventListener('click',()=>document.querySelector('.panel').classList.toggle('open'));

fillArrondissements();refreshMap();resetView();
</script>
