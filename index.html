<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Répartition des entreprises - Podor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body,#map{height:100%;margin:0;font-family:Arial,sans-serif}
#map{z-index:1}
.panel{
 position:absolute;z-index:1000;top:15px;left:15px;width:370px;
 max-height:calc(100vh - 30px);background:#fff;border-radius:12px;
 box-shadow:0 3px 18px rgba(0,0,0,.28);overflow:hidden
}
.header{padding:16px 18px;background:#f8f9fa;border-bottom:1px solid #e5e5e5}
.header h1{margin:0 0 5px;font-size:19px}
.header p{margin:0;font-size:12px;color:#666}
.body{padding:14px}
label{display:block;margin:10px 0 5px;font-size:12px;font-weight:bold}
input{width:100%;padding:10px;border:1px solid #ccc;border-radius:7px;font-size:14px}
.stats{margin:12px 0;padding:11px;border-radius:8px;background:#f1f3f5;font-size:14px}
.actions{display:flex;gap:7px;margin-bottom:10px}
button{border:0;border-radius:7px;padding:9px 12px;cursor:pointer;background:#e9ecef}
button:hover{filter:brightness(.95)}
#reset{background:#222;color:#fff}
#results{overflow-y:auto;max-height:42vh;border-top:1px solid #eee}
.result{padding:10px;border-bottom:1px solid #eee;cursor:pointer}
.result:hover{background:#f5f5f5}
.result strong{display:block;margin-bottom:3px}
.result small{color:#666}
.popup-title{font-weight:bold;font-size:16px;margin-bottom:8px}
.popup-table{border-collapse:collapse;font-size:12px}
.popup-table td{padding:4px 8px 4px 0;vertical-align:top}
.popup-table td:first-child{font-weight:bold}
#toggle{display:none;position:absolute;z-index:1001;top:15px;left:15px;background:white;box-shadow:0 2px 10px rgba(0,0,0,.3)}
@media(max-width:700px){
 .panel{display:none;top:60px;left:10px;width:calc(100% - 20px);max-height:65vh}
 .panel.open{display:block}
 #toggle{display:block}
 #results{max-height:28vh}
}
</style>
</head>
<body>

<div id="map"></div>
<button id="toggle">☰ Recherche</button>

<div class="panel">
  <div class="header">
    <h1>Répartition des entreprises</h1>
    <p>Cartographie interactive — Podor</p>
  </div>

  <div class="body">
    <label for="search">Rechercher une entreprise</label>
    <input id="search" type="text" placeholder="Nom de l'entreprise...">

    <div class="stats">
      <b id="count">931</b> entreprise(s) affichée(s)
    </div>

    <div class="actions">
      <button id="reset">↺ Vue générale</button>
      <button id="clear">✕ Réinitialiser</button>
    </div>

    <div id="results"></div>
  </div>
</div>

const map = L.map('map');

const osm = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);

const satellite = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {
    maxZoom: 19,
    attribution: 'Tiles &copy; Esri'
  }
);

L.control.layers(
  {'OpenStreetMap': osm, 'Satellite': satellite},
  null,
  {collapsed:false}
).addTo(map);

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, function(char) {
    return {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[char];
  });
}

const features = DATA.features;

function popupContent(properties) {
  let rows = '';

  Object.entries(properties).forEach(([key,value]) => {
    if (value !== null && value !== undefined && value !== '') {
      rows += `
        <tr>
          <td>${esc(key)}</td>
          <td>${esc(value)}</td>
        </tr>`;
    }
  });

  const title = properties.Points || 'Entreprise';

  return `
    <div class="popup-title">${esc(title)}</div>
    <table class="popup-table">${rows}</table>
  `;
}

let enterpriseLayer = L.geoJSON(DATA, {
  pointToLayer: function(feature, latlng) {
    return L.circleMarker(latlng, {
      radius: 7,
      weight: 1,
      fillOpacity: 0.82
    });
  },
  onEachFeature: function(feature, layer) {
    layer.bindPopup(popupContent(feature.properties));
  }
}).addTo(map);

function resetView() {
  const bounds = enterpriseLayer.getBounds();
  if (bounds.isValid()) {
    map.fitBounds(bounds.pad(0.05));
  }
}

function getFilteredFeatures() {
  const search = document
    .getElementById('search')
    .value
    .trim()
    .toLowerCase();

  return features.filter(feature => {
    return Object.values(feature.properties).some(value =>
      String(value ?? '').toLowerCase().includes(search)
    );
  });
}

function refreshMap() {
  const filtered = getFilteredFeatures();

  enterpriseLayer.clearLayers();

  const newLayer = L.geoJSON(
    {
      type:'FeatureCollection',
      features:filtered
    },
    {
      pointToLayer:function(feature,latlng) {
        return L.circleMarker(latlng,{
          radius:7,
          weight:1,
          fillOpacity:0.82
        });
      },
      onEachFeature:function(feature,layer) {
        layer.bindPopup(popupContent(feature.properties));
      }
    }
  );

  newLayer.eachLayer(layer => enterpriseLayer.addLayer(layer));

  document.getElementById('count').textContent = filtered.length;

  const results = document.getElementById('results');
  results.innerHTML = '';

  filtered.slice(0,200).forEach(feature => {
    const properties = feature.properties;
    const item = document.createElement('div');

    item.className = 'result';

    const name = properties.Points || 'Entreprise sans nom';

    item.innerHTML = `
      <strong>${esc(name)}</strong>
      <small>
        Coordonnées :
        ${feature.geometry.coordinates[1].toFixed(5)},
        ${feature.geometry.coordinates[0].toFixed(5)}
      </small>
    `;

    item.onclick = function() {
      const [longitude,latitude] = feature.geometry.coordinates;

      map.setView([latitude,longitude],15);

      const point = enterpriseLayer
        .getLayers()
        .find(layer => layer.feature === feature);

      if (point) point.openPopup();
    };

    results.appendChild(item);
  });
}

document.getElementById('search').addEventListener(
  'input',
  refreshMap
);

document.getElementById('clear').addEventListener(
  'click',
  function() {
    document.getElementById('search').value = '';
    refreshMap();
    resetView();
  }
);

document.getElementById('reset').addEventListener(
  'click',
  resetView
);

document.getElementById('toggle').addEventListener(
  'click',
  function() {
    document.querySelector('.panel').classList.toggle('open');
  }
);

refreshMap();
resetView();
</script>
</body>
</html>
